    ProductEditHistoryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        actorName:
          type: string
          minLength: 1
          maxLength: 120
          description: Name snapshot at change time; not joined to current user name.
        changedAt:
          type: string
          format: date-time
          description: PostgreSQL clock_timestamp() at log insert after acquiring the
