          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductDto'
                required:
                - data
                additionalProperties: false
              example:
                data:
                  id: 11111111-1111-4111-8111-111111111111
                  sku: WDG-001
                  name: Warehouse user
                  unit: pcs
                  createdAt: '2026-10-29T00:00:00Z'
      parameters:
      - $ref: '#/components/parameters/Id'
      x-roles:
      - OPERATOR
      - SUPERVISOR
    patch:
      operationId: updateProduct
      tags:
      - products
      summary: Correct product SKU or name
      description: "SUPERVISOR only. Strict body with at least one sku/name. Trim and uppercase SKU; trim name and count Unicode code points. Existing own SKU is allowed. Products already received remain editable; preserve identity, unit, inventory, quantities and transaction relationships. Receiving/inventory/history display current product labels. Atomic update and database unique constraint arbitrate concurrent SKU edits. Unknown query/body fields rejected. Missing product: 404 PRODUCT_NOT_FOUND. Duplicate SKU of another product: 409 SKU_ALREADY_EXISTS. Trusted Origin/Referer, JSON and CSRF required. Receipt replay unchanged. Effective edits now lock product and atomically persist before/after plus authenticated actor/name snapshot in product_edit_history; no-op after normalization creates no log. Failed update/log rolls back both. No log backfill for edits before this feature."
      security:
      - LocalSession: []
      - SecureSession: []
      responses:
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductDto'
                required:
                - data
                additionalProperties: false
              example:
                data:
                  id: 11111111-1111-4111-8111-111111111111
                  sku: WDG-001
                  name: Warehouse user
                  unit: pcs
                  createdAt: '2026-10-29T00:00:00Z'
        '409':
