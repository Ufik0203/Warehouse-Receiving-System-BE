        changedFields:
          type: array
          items:
            type: string
            enum:
            - sku
            - name
          minItems: 1
          maxItems: 2
          uniqueItems: true
        before:
          type: object
          properties:
            sku:
              type: string
              minLength: 1
              maxLength: 40
              description: Trim and uppercase before matching ^[A-Z0-9_-]+$. Raw lowercase
                input is normalized, not rejected.
              x-normalized-pattern: ^[A-Z0-9_-]+$
            name:
              type: string
              minLength: 1
              maxLength: 120
              description: Trim before validation; count Unicode code points, not UTF-16
                units, bytes or grapheme clusters.
          required:
          - sku
          - name
          additionalProperties: false
        after:
          type: object
          properties:
            sku:
              type: string
              minLength: 1
              maxLength: 40
              description: Trim and uppercase before matching ^[A-Z0-9_-]+$. Raw lowercase
                input is normalized, not rejected.
              x-normalized-pattern: ^[A-Z0-9_-]+$
            name:
              type: string
              minLength: 1
              maxLength: 120
              description: Trim before validation; count Unicode code points, not UTF-16
                units, bytes or grapheme clusters.
          required:
          - sku
          - name
          additionalProperties: false
      required:
      - id
      - productId
      - actorId
      - actorName
      - changedAt
      - changedFields
      - before
      - after
      additionalProperties: false
    CreateReceivingInput:
      type: object
      properties:
        reference:
          type: string
          maxLength: 160
          default: ''
          description: Trim before validation; count Unicode code points.
        items:
          type: array
          items:
            type: object
            properties:
              productId: *id003
              expectedQuantity: *id004
            required:
            - productId
            - expectedQuantity
            additionalProperties: false
          minItems: 1
          maxItems: 50
          description: Unique normalized productId values; backend validates property uniqueness.
      required:
      - items
      additionalProperties: false
    ReceiveItemsInput:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              receivingItemId: *id003
              quantity: *id004
            required:
            - receivingItemId
            - quantity
            additionalProperties: false
          minItems: 1
          maxItems: 50
          description: Unique normalized receivingItemId values, all in the target document. Quantity is a delta,
            at most remaining. Backend validates under lock.
      required:
      - items
      additionalProperties: false
    CsrfDto:
      type: object
      properties:
        csrfToken:
          type: string
          description: Session-bound token generated from at least 32 random bytes; stable for this session.
      required:
      - csrfToken
      additionalProperties: false
    LoginDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserDto'
