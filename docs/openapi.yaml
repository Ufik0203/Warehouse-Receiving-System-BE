          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserDto'
                required:
                - data
                additionalProperties: false
              example:
                data:
                  id: 11111111-1111-4111-8111-111111111111
                  email: example
                  name: Warehouse user
                  role: OPERATOR
