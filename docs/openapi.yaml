        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '415':
          $ref: '#/components/responses/Error415'
        '413':
          $ref: '#/components/responses/Error413'
        '404':
          description: RECEIVING_NOT_FOUND or RECEIVING_ITEM_NOT_FOUND (including cross-document item).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: RECEIVING_ITEM_NOT_FOUND
                  message: Item not in receiving.
                  requestId: example-request-id
        '409':
          $ref: '#/components/responses/Error409'
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReceiptDto'
                required:
                - data
                additionalProperties: false
              example:
                data:
                  id: 11111111-1111-4111-8111-111111111111
                  receivingId: 11111111-1111-4111-8111-111111111111
                  receivedBy: 11111111-1111-4111-8111-111111111111
                  receivedAt: '2026-10-29T00:00:00Z'
                  items:
                  - receivingItemId: 11111111-1111-4111-8111-111111111111
                    productId: 11111111-1111-4111-8111-111111111111
                    quantity: 1
          headers:
            Idempotency-Replayed:
              description: Whether this response replays the original receipt.
              schema:
                type: boolean
                enum:
                - false
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReceiptDto'
                required:
                - data
                additionalProperties: false
              example:
                data:
                  id: 11111111-1111-4111-8111-111111111111
                  receivingId: 11111111-1111-4111-8111-111111111111
                  receivedBy: 11111111-1111-4111-8111-111111111111
                  receivedAt: '2026-10-29T00:00:00Z'
                  items:
                  - receivingItemId: 11111111-1111-4111-8111-111111111111
                    productId: 11111111-1111-4111-8111-111111111111
                    quantity: 1
          headers:
            Idempotency-Replayed:
              description: Whether this response replays the original receipt.
              schema:
                type: boolean
                enum:
                - true
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Csrf'
      - name: Origin
        in: header
        schema:
          type: string
          format: uri
        description: Must match APP_ORIGIN. If absent, a trusted Referer origin is required.
      - name: Referer
        in: header
        schema:
          type: string
          format: uri
        description: Used only when Origin is absent. Both absent or untrusted is rejected.
      - $ref: '#/components/parameters/Idempotency'
      requestBody:
