openapi: 3.0.3
info:
  title: Warehouse Receiving System API
  version: 0.1.0
  description: Documentation contract derived from docs/api-contract.md and explicit PRD/technical rules. Foundation health, four authentication endpoints and core products/receivings/inventory endpoints are implemented;
    user management endpoints are also implemented. All 22 documented operations are available; runtime evidence is scoped in testing.md. Business paths /api/v1; health paths outside it. Request objects reject unknown fields. Non-password
    text lengths use Unicode code points after documented field normalization; numeric limits are unchanged.
    Mutations require trusted Origin or Referer, Content-Type application/json even without a body, and session-bound
    CSRF including login. Dependency failures fail closed with 503. See technical-spec.md for session lifetimes
    and rate limits.
servers:
- url: /
paths:
  /api/v1/auth/csrf-token:
    get:
      operationId: getCsrfToken
      tags:
      - auth
      summary: getCsrfToken
      description: 'Initialize anonymous session if needed; save before returning stable token. Existing authenticated
        sessions are supported. No authenticated identity required. Unknown query parameters are rejected with 400.
        All authentication responses, including errors, use Cache-Control: no-store.'
      security: []
      responses:
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CsrfDto'
                required:
                - data
                additionalProperties: false
              example:
                data:
                  csrfToken: example-session-bound-token
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: All authentication responses, including errors, use no-store.
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: login
      description: 'Anonymous session cookie and CSRF bootstrap required. Regenerate session after valid credentials,
        rotate CSRF, save before response. Generic credential failure. Content-Type application/json is required,
        including no-body mutations; no body is required for logout or DELETE. No authenticated identity required.
        Unknown query parameters are rejected with 400. All authentication responses, including errors, use Cache-Control:
        no-store.'
      security:
      - LocalSession: []
      - SecureSession: []
      responses:
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '403':
          $ref: '#/components/responses/Error403'
        '415':
          $ref: '#/components/responses/Error415'
        '413':
          $ref: '#/components/responses/Error413'
        '401':
          $ref: '#/components/responses/Error401'
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginDto'
                required:
                - data
                additionalProperties: false
              example:
                data:
                  user:
                    id: 11111111-1111-4111-8111-111111111111
                    email: example
                    name: Warehouse user
                    role: OPERATOR
                    isActive: true
                    deletedAt: null
                    createdAt: '2026-10-29T00:00:00Z'
                    updatedAt: '2026-10-29T00:00:00Z'
                  csrfToken: example-session-bound-token
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: All authentication responses, including errors, use no-store.
            Set-Cookie:
              schema:
                type: string
              description: 'New session cookie: HttpOnly, host-only, SameSite=Lax, Path=/; Secure on HTTPS. Never
                returns session ID in JSON.'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - name: Origin
        in: header
        schema:
          type: string
          format: uri
        description: Must match APP_ORIGIN. If absent, a trusted Referer origin is required.
      - name: Referer
        in: header
        schema:
          type: string
          format: uri
        description: Used only when Origin is absent. Both absent or untrusted is rejected.
      requestBody:
        required: true
        description: Strict JSON body; maximum 64 KiB. Normalization and domain validation are enforced by the backend.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: supervisor@example.com
              password: example-password-123
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags:
      - auth
      summary: getCurrentUser
      description: 'OPERATOR and SUPERVISOR. Unknown query parameters are rejected with 400. All authentication
        responses, including errors, use Cache-Control: no-store.'
      security:
      - LocalSession: []
      - SecureSession: []
      responses:
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserDto'
                required:
                - data
                additionalProperties: false
              example:
                data:
                  id: 11111111-1111-4111-8111-111111111111
                  email: example
                  name: Warehouse user
                  role: OPERATOR
                  isActive: true
                  deletedAt: null
                  createdAt: '2026-10-29T00:00:00Z'
                  updatedAt: '2026-10-29T00:00:00Z'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: All authentication responses, including errors, use no-store.
      x-roles:
      - OPERATOR
      - SUPERVISOR
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: logout
      description: 'No request body. Destroy Redis session and await success, then clear cookie with matching attributes.
        Content-Type application/json is required, including no-body mutations; no body is required for logout or
        DELETE. OPERATOR and SUPERVISOR. Unknown query parameters are rejected with 400. All authentication responses,
        including errors, use Cache-Control: no-store.'
      security:
      - LocalSession: []
      - SecureSession: []
      responses:
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '415':
          $ref: '#/components/responses/Error415'
        '204':
          description: No response body.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: All authentication responses, including errors, use no-store.
            Set-Cookie:
              schema:
                type: string
              description: Expires the session cookie.
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - name: Origin
        in: header
        schema:
          type: string
          format: uri
        description: Must match APP_ORIGIN. If absent, a trusted Referer origin is required.
      - name: Referer
        in: header
        schema:
          type: string
          format: uri
        description: Used only when Origin is absent. Both absent or untrusted is rejected.
      x-roles:
      - OPERATOR
      - SUPERVISOR
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
