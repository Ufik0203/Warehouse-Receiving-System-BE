      summary: deleteUser
      description: "Soft delete, deactivate and increment authVersion; preserve history. Repeated deletion returns 204 with no additional change. No self-delete; retain one active supervisor; shared advisory lock and actor recheck. Content-Type application/json is required, including no-body mutations; no body is required for logout or DELETE. Supervisor only. Unknown query parameters are rejected with 400. Missing user: 404 USER_NOT_FOUND; repeated deletion of an existing deleted user: 204."
