      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/Role'
      - name: isActive
        in: query
        schema:
          type: string
          enum: &id001
          - 'true'
          - 'false'
      - name: includeDeleted
        in: query
        schema:
          type: string
          enum: *id001
          default: 'false'
      x-roles:
      - SUPERVISOR
    post:
      operationId: createUser
      tags:
      - users
      summary: createUser
      description: Content-Type application/json is required, including no-body mutations; no body is required for
        logout or DELETE. Supervisor only. Unknown query parameters are rejected with 400.
      security:
      - LocalSession: []
      - SecureSession: []
      responses:
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
