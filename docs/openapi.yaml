components:
  schemas:
    Role:
      type: string
      enum:
      - OPERATOR
      - SUPERVISOR
    ReceivingStatus:
      type: string
      enum:
      - OPEN
      - PARTIAL
      - COMPLETED
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        isActive:
          type: boolean
        deletedAt:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp.
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp.
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp.
      required:
      - id
      - email
      - name
      - role
      - isActive
      - deletedAt
      - createdAt
      - updatedAt
      additionalProperties: false
    ProductDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        unit:
          type: string
          enum:
          - pcs
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp.
      required:
      - id
      - sku
      - name
      - unit
      - createdAt
      additionalProperties: false
    ReceivingDto:
      type: object
      properties:
        id: &id005
          type: string
          format: uuid
        number: &id006
          type: string
          minLength: 40
          maxLength: 40
          pattern: ^RCV-[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$
        reference: &id007
          type: string
        status: &id008
          $ref: '#/components/schemas/ReceivingStatus'
        createdBy: &id009
          type: string
          format: uuid
        createdAt: &id010
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp.
        updatedAt: &id011
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp.
      required:
      - id
      - number
      - reference
      - status
      - createdBy
      - createdAt
      - updatedAt
      additionalProperties: false
    ReceivingItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        productName:
          type: string
        expectedQuantity: &id004
          type: integer
          minimum: 1
          maximum: 1000000
        receivedQuantity:
          type: integer
          minimum: 0
          maximum: 1000000
        remainingQuantity:
          type: integer
          minimum: 0
          maximum: 1000000
      required:
      - id
      - productId
      - sku
      - productName
      - expectedQuantity
      - receivedQuantity
      - remainingQuantity
      additionalProperties: false
    InventoryDto:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        sku:
          type: string
        productName:
          type: string
        unit:
          type: string
          enum:
          - pcs
        availableQuantity:
          type: string
          pattern: ^[0-9]+$
          description: Nonnegative bigint serialized as decimal string; never JSON number.
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp.
      required:
      - productId
      - sku
      - productName
      - unit
      - availableQuantity
      - updatedAt
      additionalProperties: false
    InventoryTransactionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        receiptId:
          type: string
          format: uuid
        receivingId:
          type: string
          format: uuid
        receivingNumber:
          type: string
        receivingItemId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        productName:
          type: string
        quantity: *id004
        actorId:
          type: string
          format: uuid
        actorName:
          type: string
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp.
      required:
      - id
      - receiptId
      - receivingId
      - receivingNumber
      - receivingItemId
      - productId
      - sku
      - productName
      - quantity
      - actorId
      - actorName
      - createdAt
      additionalProperties: false
    ReceivingDetailDto:
      type: object
      properties:
        id: *id005
        number: *id006
        reference: *id007
        status: *id008
        createdBy: *id009
        createdAt: *id010
        updatedAt: *id011
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceivingItemDto'
          minItems: 1
          maxItems: 50
      required:
      - id
      - number
      - reference
      - status
      - createdBy
      - createdAt
      - updatedAt
      - items
      additionalProperties: false
    ReceiptDto:
      type: object
      properties:
        id: *id003
        receivingId: *id003
        receivedBy: *id003
        receivedAt:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp.
        items:
          type: array
          items:
            type: object
            properties:
              receivingItemId: *id003
              productId: *id003
              quantity: *id004
            required:
            - receivingItemId
            - productId
            - quantity
            additionalProperties: false
          minItems: 1
          maxItems: 50
      required:
      - id
      - receivingId
      - receivedBy
      - receivedAt
      - items
      additionalProperties: false
    LoginInput:
      type: object
      properties:
        email: &id012
          type: string
          format: email
          maxLength: 254
          description: Trim and lowercase before storage and comparison; length counts Unicode code points. Includes deleted users in uniqueness.
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: Unicode code points; do not trim or normalize.
      required:
      - email
      - password
      additionalProperties: false
    CreateUserInput:
      type: object
      properties:
        name: &id013
          type: string
          minLength: 1
          maxLength: 120
          description: Trim before validation; count Unicode code points, not UTF-16 units, bytes or grapheme clusters.
        email: *id012
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Unicode code points; do not trim or normalize.
        role:
          $ref: '#/components/schemas/Role'
      required:
      - name
      - email
      - password
      - role
      additionalProperties: false
    UpdateUserInput:
      type: object
      properties:
        name: *id013
        role:
          $ref: '#/components/schemas/Role'
