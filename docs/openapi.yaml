      summary: getUser
      description: "Deleted users remain readable for historical tracing. Supervisor only. Unknown query parameters are rejected with 400. Missing user: 404 USER_NOT_FOUND; deleted user remains readable."
      security:
      - LocalSession: []
      - SecureSession: []
      responses:
