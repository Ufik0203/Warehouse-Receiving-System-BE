          type: boolean
      additionalProperties: false
      minProperties: 1
      example: *id014
    CreateProductInput:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 40
          description: Trim and uppercase before matching ^[A-Z0-9_-]+$. Raw lowercase input is normalized, not
            rejected.
          x-normalized-pattern: ^[A-Z0-9_-]+$
        name: *id013
      required:
      - sku
      - name
      additionalProperties: false
    UpdateProductInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 40
          description: Trim and uppercase before matching ^[A-Z0-9_-]+$. Raw lowercase
