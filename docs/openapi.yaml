      - page
      - limit
      - total
      additionalProperties: false
    LiveDto:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
      required:
      - status
      additionalProperties: false
    ReadyDto:
      type: object
      properties:
        status:
          type: string
          enum:
          - ready
        dependencies:
          type: object
          properties:
            postgres:
              type: string
              enum:
              - up
            redis:
              type: string
              enum:
              - up
          required:
          - postgres
          - redis
          additionalProperties: false
      required:
      - status
      - dependencies
      additionalProperties: false
  parameters:
    Id:
      name: id
