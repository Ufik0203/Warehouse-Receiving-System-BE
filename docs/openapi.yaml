                required:
                - data
                - pagination
                additionalProperties: false
              example:
                data:
                - id: 11111111-1111-4111-8111-111111111111
                  email: example
                  name: Warehouse user
                  role: OPERATOR
                  isActive: true
                  deletedAt: null
                  createdAt: '2026-10-29T00:00:00Z'
                  updatedAt: '2026-10-29T00:00:00Z'
                pagination:
                  page: 1
                  limit: 1
                  total: 1
      parameters:
      - $ref: '#/components/parameters/Page'
