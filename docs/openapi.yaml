        '415':
          $ref: '#/components/responses/Error415'
        '413':
          $ref: '#/components/responses/Error413'
        '409':
          $ref: '#/components/responses/Error409'
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserDto'
                required:
