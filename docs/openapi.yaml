  /api/v1/receivings/{id}/receipts:
    post:
      operationId: receiveItems
      tags:
      - receivings
      summary: receiveItems
      description: 'One READ COMMITTED transaction: lock receiving before idempotency lookup, replay before completed
        check, lock items and validate all remaining quantities. Atomically update receipt, item counters, ledger,
        balances in product order and status. Same key/document/actor/canonical payload replays immutable original
        body, including after completion; changed actor/payload is 409. Different item ordering is equivalent. No
        stock changes on rejection or rollback; retry with original key on uncertain outcome or TRANSACTION_RETRY_REQUIRED.
        Content-Type application/json is required, including no-body mutations; no body is required for logout or
        DELETE. OPERATOR and SUPERVISOR. Unknown query parameters are rejected with 400.'
      security:
      - LocalSession: []
      - SecureSession: []
      responses:
        '400':
          $ref: '#/components/responses/Error400'
        '500':
