      summary: updateUser
      description: "Only name, role, isActive; at least one field. Real role/status change increments authVersion. No self-demotion/deactivation or reactivation of deleted user. Shared advisory lock and actor recheck protect last active supervisor. Content-Type application/json is required, including no-body mutations; no body is required for logout or DELETE. Supervisor only. Unknown query parameters are rejected with 400. Missing user: 404 USER_NOT_FOUND; deleted user: 409 USER_DELETED."
      security:
      - LocalSession: []
      - SecureSession: []
      responses:
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '415':
          $ref: '#/components/responses/Error415'
        '413':
          $ref: '#/components/responses/Error413'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
